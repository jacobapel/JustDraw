name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          rm -rf src && mkdir src
          unzip -o -q draw-android-project.zip -d src
          CFG=$(find src -maxdepth 3 -name capacitor.config.json -not -path '*/node_modules/*' | head -1)
          echo "PROJ=$(dirname "$CFG")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        working-directory: ${{ env.PROJ }}
        run: npm ci
      - name: Sync web app into Android project
        working-directory: ${{ env.PROJ }}
        run: npx cap sync android
      - name: Build APK
        working-directory: ${{ env.PROJ }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: justdraw-apk
          path: ${{ env.PROJ }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  
